DATASET: 'Occ2LiDARDatasetNKSRGenVideo'

DATA_SPLIT: {
    'train': train,
    'test': val
}

DATA_PATH: "/data/longhun/3D/nuscenes/data"
split_root: "/data/longhun/3D/drive_scene/lidarnet/annos/"
lidar_root: "/data/longhun/3D/nuscenes/data/nuscenes"
#occ_root: "/data/longhun/3D/nuscenes/data/pyramid_occ/nuscene_quantized_200_200_16/quantized"
occ_root: "/data/longhun/3D/nuscenes/data/nksr_occ_gen/eval_200_1016/200_iter0008000"
occ_anno_file: "/data/longhun/3D/drive_scene/lidarnet/annos/nuScenes_occ2lidar_nksr.json"
POINT_CLOUD_RANGE: [-50.0, -50.0, -5.0, 50.0, 50.0, 3.0]
GRID_SIZE: [200, 200, 16]
VOXEL_SIZE: [0.5, 0.5, 0.5]

POINT_FEATURE_ENCODING: {
    encoding_type: absolute_coordinates_encoding,
    used_feature_list: ['x', 'y', 'z', 'intensity', 'time'],
    src_feature_list: ['x', 'y', 'z', 'intensity', 'time'],
}

DATA_AUGMENTOR:
    DISABLE_AUG_LIST: ['random_world_flip', 'random_world_rotation', 'random_world_scaling']
    AUG_CONFIG_LIST:
        - NAME: random_world_flip
          ALONG_AXIS_LIST: ['x', 'y']

        - NAME: random_world_rotation
          WORLD_ROT_ANGLE: [-0.78539816, 0.78539816]

        - NAME: random_world_scaling
          WORLD_SCALE_RANGE: [0.95, 1.05]

