DATASET: 'NuPlanOccDatasetTemporal'

DATA_SPLIT: {
    'train': train,
    'test': val
}
DATA_PATH: "data/nuplan_all"
lidar_path: "data/nuplan_all/sensor_blobs/mini"
pkl_path: "data/nuplan_pkls/mini/nuplan_mini_10hz_train.pkl"
val_pkl_path: "data/nuplan_pkls/mini/nuplan_mini_10hz_val.pkl"
occ_path: "data/occ_quan/nuplan_quantized_200_200_16"
POINT_CLOUD_RANGE: [-50.0, -50.0, -5.0, 50.0, 50.0, 3.0]
GRID_SIZE: [200, 200, 16]
VOXEL_SIZE: [0.5, 0.5, 0.5]
top_lidar_only: False

POINT_FEATURE_ENCODING: {
    encoding_type: absolute_coordinates_encoding,
    used_feature_list: ['x', 'y', 'z', 'intensity', 'ring', 'lidar_idx'],
    src_feature_list: ['x', 'y', 'z', 'intensity', 'ring', 'lidar_idx'],
}

DATA_AUGMENTOR:
    DISABLE_AUG_LIST: ['random_world_flip', 'random_world_rotation', 'random_world_scaling']
    AUG_CONFIG_LIST:
        - NAME: random_world_flip
          ALONG_AXIS_LIST: ['x', 'y']

        - NAME: random_world_rotation
          WORLD_ROT_ANGLE: [-0.78539816, 0.78539816]

        - NAME: random_world_scaling
          WORLD_SCALE_RANGE: [0.95, 1.05]

